<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>詞境 · 影音歌詞同步器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12141c;
    --surface:#1b1e2a;
    --surface-2:#242838;
    --accent:#f2a93b;
    --accent-dim:#8a672a;
    --accent-2:#4fd1c5;
    --text:#ededf5;
    --text-dim:#767b94;
    --line:rgba(255,255,255,0.08);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(242,169,59,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 10%, rgba(79,209,197,0.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:8px;}
  header .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--accent-2);text-transform:uppercase;}
  header h1{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;margin:2px 0 0;letter-spacing:-0.01em;}
  header h1 span{color:var(--accent);}

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
  }
  .panel-title{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:0 0 12px;
  }

  /* --- input row --- */
  .input-row{display:flex;gap:8px;flex-wrap:wrap;}
  input[type="text"], textarea{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:10px 12px;
    outline:none;
    transition:border-color .15s ease;
  }
  input[type="text"]{flex:1;min-width:200px;}
  input[type="text"]:focus, textarea:focus{border-color:var(--accent-2);}
  textarea{width:100%;resize:vertical;min-height:110px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.6;}

  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--text);
    border-radius:10px;
    padding:10px 16px;
    cursor:pointer;
    transition:transform .1s ease, border-color .15s ease, color .15s ease;
  }
  button:hover{border-color:var(--accent);}
  button:active{transform:scale(0.97);}
  button:focus-visible, input:focus-visible, textarea:focus-visible, .lyric-line:focus-visible{
    outline:2px solid var(--accent-2); outline-offset:2px;
  }
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#1a1305;}
  .btn-primary:hover{border-color:var(--accent);opacity:.92;}

  /* --- video --- */
  .video-frame{
    position:relative;width:100%;padding-top:56.25%;
    border-radius:10px;overflow:hidden;background:#000;
    border:1px solid var(--line);
  }
  #player{position:absolute;inset:0;width:100%;height:100%;}
  .video-frame.empty::after{
    content:"貼上 YouTube 連結後按「載入影片」";
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);font-size:13px;font-family:'JetBrains Mono',monospace;
  }

  /* --- speed controls --- */
  .speed-row{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap;}
  .vinyl{
    width:44px;height:44px;border-radius:50%;flex:0 0 auto;
    background:
      radial-gradient(circle at center, var(--surface) 0 6px, transparent 6.5px),
      repeating-radial-gradient(circle at center, #05060a 0 2px, #14161f 2px 4px);
    border:2px solid var(--accent-dim);
    animation:spin 2.4s linear infinite;
    animation-play-state:paused;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;padding:7px 11px;border-radius:8px;
    background:var(--surface-2);border:1px solid var(--line);color:var(--text-dim);cursor:pointer;
  }
  .chip.active{background:var(--accent);color:#1a1305;border-color:var(--accent);font-weight:600;}
  .fine-tune{display:flex;align-items:center;gap:8px;margin-left:auto;}
  .fine-tune input[type="range"]{accent-color:var(--accent);width:120px;}
  .rate-readout{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);min-width:42px;}

  /* --- lyrics --- */
  .lyrics-toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .offset-row{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);}
  .offset-row button{padding:5px 10px;font-size:12px;}
  #offsetVal{color:var(--accent-2);min-width:52px;text-align:center;}

  .lyrics-stage{
    position:relative;height:280px;overflow:hidden;
    border-radius:10px;background:var(--surface-2);border:1px solid var(--line);
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, black 18%, black 82%, transparent 100%);
            mask-image:linear-gradient(to bottom, transparent 0, black 18%, black 82%, transparent 100%);
  }
  .lyrics-scroll{
    position:absolute;left:0;right:0;top:50%;
    transform:translateY(-50%);
    transition:transform .35s cubic-bezier(.22,.61,.36,1);
    padding:0 22px;
  }
  .lyric-line{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;color:var(--text-dim);
    text-align:center;padding:9px 4px;cursor:pointer;
    transition:color .3s ease, font-size .3s ease, opacity .3s ease;
    border-radius:8px;
  }
  .lyric-line:hover{color:var(--text);}
  .lyric-line.current{
    color:var(--text);font-size:21px;font-weight:600;
    text-shadow:0 0 18px rgba(242,169,59,0.45);
  }
  .lyric-line.current::after{
    content:"";display:block;width:36px;height:2px;margin:8px auto 0;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    border-radius:2px;
  }
  .lyrics-empty{
    display:flex;align-items:center;justify-content:center;height:100%;
    color:var(--text-dim);font-size:13px;font-family:'JetBrains Mono',monospace;text-align:center;padding:0 24px;
  }

  details{margin-top:2px;}
  summary{cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);}
  summary:hover{color:var(--accent-2);}

  footer{text-align:center;color:var(--text-dim);font-size:11px;font-family:'JetBrains Mono',monospace;margin-top:24px;}

  @media (prefers-reduced-motion: reduce){
    .vinyl{animation:none;}
    .lyrics-scroll{transition:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="eyebrow">YOUTUBE · LYRIC SYNC</div>
      <h1>詞境<span>.</span> 影音歌詞同步器</h1>
    </div>
  </header>

  <!-- 影片區 -->
  <section class="panel">
    <p class="panel-title">01 · 影片來源</p>
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="貼上 YouTube 連結或影片 ID，例如 https://youtu.be/xxxxxxxxxxx">
      <button class="btn-primary" id="loadBtn">載入影片</button>
    </div>

    <div class="video-frame empty" id="videoFrame" style="margin-top:14px;">
      <div id="player"></div>
    </div>

    <div class="speed-row">
      <div class="vinyl" id="vinyl" aria-hidden="true"></div>
      <div class="chips" id="speedChips">
        <button class="chip" data-rate="0.25">0.25x</button>
        <button class="chip" data-rate="0.5">0.5x</button>
        <button class="chip" data-rate="0.75">0.75x</button>
        <button class="chip active" data-rate="1">1x</button>
        <button class="chip" data-rate="1.25">1.25x</button>
        <button class="chip" data-rate="1.5">1.5x</button>
        <button class="chip" data-rate="1.75">1.75x</button>
        <button class="chip" data-rate="2">2x</button>
      </div>
      <div class="fine-tune">
        <input type="range" id="rateSlider" min="0.25" max="2" step="0.05" value="1">
        <span class="rate-readout" id="rateReadout">1.00x</span>
      </div>
    </div>
  </section>

  <!-- 歌詞區 -->
  <section class="panel">
    <div class="lyrics-toolbar">
      <p class="panel-title" style="margin:0;">02 · 歌詞（同步捲動）</p>
      <div class="offset-row">
        同步微調
        <button id="offsetMinus">−0.5s</button>
        <span id="offsetVal">0.0s</span>
        <button id="offsetPlus">+0.5s</button>
      </div>
    </div>

    <div class="lyrics-stage" id="lyricsStage">
      <div class="lyrics-scroll" id="lyricsScroll">
        <div class="lyrics-empty">尚未載入歌詞 — 請於下方貼上 LRC 格式歌詞後按「套用歌詞」</div>
      </div>
    </div>

    <details style="margin-top:14px;">
      <summary>編輯 / 貼上 LRC 歌詞</summary>
      <div style="margin-top:10px;">
        <textarea id="lrcInput" placeholder="[00:12.00]第一句歌詞
[00:16.50]第二句歌詞
[00:21.00]第三句歌詞 ...">[00:00.00](示範) 貼上你的 LRC 歌詞
[00:03.00]格式為 [分:秒.毫秒] 文字
[00:07.00]載入影片後歌詞會隨播放進度捲動
[00:11.00]目前這句會放大並發光
[00:15.00]點擊任一句歌詞可跳轉到該時間點
[00:19.00]若歌詞和影片有落差，用右上角同步微調調整</textarea>
        <div style="margin-top:10px;">
          <button class="btn-primary" id="applyLrcBtn">套用歌詞</button>
        </div>
      </div>
    </details>
  </section>

  <footer>播放速度不會改變歌詞判斷邏輯 — 歌詞只依照影片實際時間軸捲動</footer>
</div>

<script>
let player;
let lyrics = [];       // [{time, text, el}]
let currentIndex = -1;
let offset = 0;
let currentRate = 1;
let pollTimer = null;

// ---------- YouTube IFrame API ----------
const tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

function onYouTubeIframeAPIReady(){
  // player created on demand when user loads a video
}

function extractVideoId(input){
  input = input.trim();
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{11})/,
    /^([\w-]{11})$/
  ];
  for(const p of patterns){
    const m = input.match(p);
    if(m) return m[1];
  }
  return null;
}

document.getElementById('loadBtn').addEventListener('click', () => {
  const id = extractVideoId(document.getElementById('urlInput').value);
  if(!id){
    alert('無法辨識 YouTube 連結或 ID，請確認網址是否正確。');
    return;
  }
  document.getElementById('videoFrame').classList.remove('empty');

  if(player && player.loadVideoById){
    player.loadVideoById(id);
  } else {
    player = new YT.Player('player', {
      videoId: id,
      playerVars: { rel: 0, playsinline: 1 },
      events: {
        onReady: () => {
          player.setPlaybackRate(currentRate);
          startPolling();
        },
        onPlaybackRateChange: (e) => syncRateUI(e.data)
      }
    });
  }
});

// ---------- Speed control ----------
const chipsWrap = document.getElementById('speedChips');
const rateSlider = document.getElementById('rateSlider');
const rateReadout = document.getElementById('rateReadout');
const vinyl = document.getElementById('vinyl');

function setRate(rate){
  currentRate = rate;
  if(player && player.setPlaybackRate) player.setPlaybackRate(rate);
  syncRateUI(rate);
}

function syncRateUI(rate){
  currentRate = rate;
  rateReadout.textContent = Number(rate).toFixed(2) + 'x';
  rateSlider.value = rate;
  [...chipsWrap.children].forEach(c=>{
    c.classList.toggle('active', Math.abs(parseFloat(c.dataset.rate) - rate) < 0.001);
  });
  vinyl.style.animationDuration = (2.4 / rate) + 's';
}

chipsWrap.addEventListener('click', (e)=>{
  const btn = e.target.closest('.chip');
  if(!btn) return;
  setRate(parseFloat(btn.dataset.rate));
});

rateSlider.addEventListener('input', ()=> setRate(parseFloat(rateSlider.value)));

// ---------- Lyrics parsing ----------
function parseLRC(text){
  const lines = text.split('\n');
  const result = [];
  const timeTag = /\[(\d{1,2}):(\d{2})(?:\.(\d{1,2}))?\]/g;
  for(const line of lines){
    const tags = [...line.matchAll(timeTag)];
    if(tags.length === 0) continue;
    const content = line.replace(timeTag, '').trim();
    if(!content) continue;
    for(const t of tags){
      const min = parseInt(t[1],10);
      const sec = parseInt(t[2],10);
      const ms = t[3] ? parseInt(t[3].padEnd(2,'0'),10)/100 : 0;
      result.push({ time: min*60 + sec + ms, text: content });
    }
  }
  result.sort((a,b)=>a.time - b.time);
  return result;
}

const scrollEl = document.getElementById('lyricsScroll');
const stageEl = document.getElementById('lyricsStage');

function renderLyrics(){
  scrollEl.innerHTML = '';
  if(lyrics.length === 0){
    scrollEl.innerHTML = '<div class="lyrics-empty">尚未載入歌詞 — 請於下方貼上 LRC 格式歌詞後按「套用歌詞」</div>';
    return;
  }
  lyrics.forEach((l, i)=>{
    const div = document.createElement('div');
    div.className = 'lyric-line';
    div.textContent = l.text;
    div.tabIndex = 0;
    div.addEventListener('click', ()=>{
      if(player && player.seekTo) player.seekTo(l.time, true);
    });
    l.el = div;
    scrollEl.appendChild(div);
  });
  currentIndex = -1;
}

document.getElementById('applyLrcBtn').addEventListener('click', ()=>{
  const raw = document.getElementById('lrcInput').value;
  const parsed = parseLRC(raw);
  if(parsed.length === 0){
    alert('沒有解析到有效的歌詞行，請確認格式為 [mm:ss.xx] 文字');
    return;
  }
  lyrics = parsed;
  renderLyrics();
});

// initial render with placeholder message
renderLyrics();

// ---------- Offset ----------
document.getElementById('offsetPlus').addEventListener('click', ()=>{
  offset += 0.5;
  document.getElementById('offsetVal').textContent = offset.toFixed(1)+'s';
});
document.getElementById('offsetMinus').addEventListener('click', ()=>{
  offset -= 0.5;
  document.getElementById('offsetVal').textContent = offset.toFixed(1)+'s';
});

// ---------- Sync loop ----------
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(()=>{
    if(!player || !player.getCurrentTime || lyrics.length === 0) return;
    const t = player.getCurrentTime() + offset;
    let idx = -1;
    for(let i=0;i<lyrics.length;i++){
      if(lyrics[i].time <= t) idx = i; else break;
    }
    if(idx !== currentIndex){
      if(currentIndex >=0 && lyrics[currentIndex].el) lyrics[currentIndex].el.classList.remove('current');
      currentIndex = idx;
      if(idx >= 0 && lyrics[idx].el){
        lyrics[idx].el.classList.add('current');
        const stageHeight = stageEl.clientHeight;
        const lineTop = lyrics[idx].el.offsetTop;
        const lineHeight = lyrics[idx].el.offsetHeight;
        const targetY = (stageHeight/2) - lineTop - lineHeight/2;
        scrollEl.style.transform = `translateY(${targetY}px)`;
      }
    }
    // also spin/pause vinyl based on player state
    const state = player.getPlayerState();
    vinyl.style.animationPlayState = (state === 1) ? 'running' : 'paused';
  }, 150);
}
</script>
</body>
</html>
